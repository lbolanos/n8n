AWSTemplateFormatVersion: '2010-09-09'
Description: AWS CloudFormation template for n8n on AWS Fargate with ALB.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Your existing VPC ID.
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnet IDs for Fargate tasks (typically private).
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnet IDs for the ALB (public).
  DesiredTasks:
    Type: Number
    Default: 2
    Description: Number of n8n tasks for HA.
  N8NImageUrl:
    Type: String
    Default: "docker.n8n.io/n8nio/n8n:latest"
    Description: n8n Docker image URI.
  N8NHostName:
    Type: String
    Description: The hostname for accessing n8n (e.g., n8n.yourdomain.com).
  SSLCertificateArn:
    Type: String
    Description: ACM SSL certificate ARN for the ALB.
  TaskCpu:
    Type: String
    Default: "1024"
    Description: CPU units for the Fargate task.
  TaskMemory:
    Type: String
    Default: "2048"
    Description: Memory for the Fargate task.
  LogRetentionInDays:
    Type: Number
    Default: 7
    Description: CloudWatch Log group retention.
  DBHost:
    Type: String
    Description: RDS instance endpoint.
  DBPort:
    Type: String
    Default: "5432"
    Description: RDS port.
  DBName:
    Type: String
    Default: "n8n"
    Description: RDS database name.
  DBUser:
    Type: String
    Default: "n8nuser"
    Description: RDS username.
  DBPasswordSecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret for the DB password.
  Timezone:
    Type: String
    Default: "America/New_York"
    Description: Timezone for n8n.
  ExecutionsMode:
    Type: String
    Default: "queue"
    Description: n8n execution mode.
  NodeEnv:
    Type: String
    Default: "production"
    Description: Node environment.
  EncryptionKeySecretArn:
    Type: String
    Default: ""
    Description: "ARN of Secrets Manager secret for N8N_ENCRYPTION_KEY. Highly Recommended."
  SmtpHost:
    Type: String
    Default: ""
    Description: SMTP Host for email notifications.
  SmtpPort:
    Type: String
    Default: "587"
    Description: SMTP Port.
  SmtpUser:
    Type: String
    Default: ""
    Description: SMTP User.
  SmtpPasswordSecretArn:
    Type: String
    Default: ""
    Description: ARN of Secrets Manager secret for SMTP password.
  SmtpSender:
    Type: String
    Default: ""
    Description: SMTP Sender Email.
  EmailMode:
    Type: String
    Default: "smtp"
    Description: N8N_EMAIL_MODE.
  TaskRoleArn:
    Type: String
    Description: "Optional: ARN of an existing IAM Role for the n8n tasks to interact with other AWS services (e.g., S3, Lambda). Leave blank if not needed."
    Default: ""
  RDSSecurityGroupId:
    Type: String
    Description: "ID of the Security Group for your RDS instance. This SG must allow inbound traffic from the Fargate Service SG on the DB port."

Conditions:
  HasEncryptionKey: !Not [!Equals [!Ref EncryptionKeySecretArn, ""]]
  HasSmtpPassword: !Not [!Equals [!Ref SmtpPasswordSecretArn, ""]]
  HasTaskRole: !Not [!Equals [!Ref TaskRoleArn, ""]]
  HasSmtpConfiguration: !Not [!Equals [!Ref SmtpHost, ""]]


Resources:
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: n8n-cluster

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/n8n-app
      RetentionInDays: !Ref LogRetentionInDays

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: n8nExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: n8n-app-cf
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !Ref ExecutionRole
      TaskRoleArn: !If [HasTaskRole, !Ref TaskRoleArn, !Ref "AWS::NoValue"]
      ContainerDefinitions:
        - Name: n8n
          Image: !Ref N8NImageUrl
          PortMappings:
            - ContainerPort: 5678
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment:
            - Name: NODE_ENV
              Value: !Ref NodeEnv
            - Name: N8N_HOST
              Value: !Ref N8NHostName
            - Name: DB_TYPE
              Value: "postgresdb"
            - Name: DB_POSTGRESDB_HOST
              Value: !Ref DBHost
            - Name: DB_POSTGRESDB_PORT
              Value: !Ref DBPort
            - Name: DB_POSTGRESDB_DATABASE
              Value: !Ref DBName
            - Name: DB_POSTGRESDB_USER
              Value: !Ref DBUser
            - Name: EXECUTIONS_MODE
              Value: !Ref ExecutionsMode
            - Name: TZ
              Value: !Ref Timezone
            - Name: N8N_EMAIL_MODE
              Value: !If [HasSmtpConfiguration, !Ref EmailMode, ""] # Set only if SMTP is configured
            - Name: N8N_EMAIL_SMTP_HOST
              Value: !If [HasSmtpConfiguration, !Ref SmtpHost, ""]
            - Name: N8N_EMAIL_SMTP_PORT
              Value: !If [HasSmtpConfiguration, !Ref SmtpPort, ""]
            - Name: N8N_EMAIL_SMTP_USER
              Value: !If [HasSmtpConfiguration, !Ref SmtpUser, ""]
            - Name: N8N_EMAIL_SMTP_SENDER
              Value: !If [HasSmtpConfiguration, !Ref SmtpSender, ""]
          Secrets:
            - Name: DB_POSTGRESDB_PASSWORD
              ValueFrom: !Ref DBPasswordSecretArn
            - !If
              - HasEncryptionKey
              - Name: N8N_ENCRYPTION_KEY
                ValueFrom: !Ref EncryptionKeySecretArn
              - !Ref AWS::NoValue
            - !If
              - HasSmtpPassword
              - Name: N8N_EMAIL_SMTP_PASSWORD
                ValueFrom: !Ref SmtpPasswordSecretArn
              - !Ref AWS::NoValue

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTPS and n8n traffic
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 5678
          ToPort: 5678
          DestinationSecurityGroupId: !GetAtt FargateServiceSecurityGroup.GroupId

  FargateServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow n8n traffic from ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5678
          ToPort: 5678
          SourceSecurityGroupId: !GetAtt ALBSecurityGroup.GroupId
      SecurityGroupEgress:
        - IpProtocol: "-1" # All traffic
          CidrIp: 0.0.0.0/0

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: n8n-alb
      Subnets: !Ref PublicSubnetIds
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Scheme: internet-facing

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: n8n-tg
      Protocol: HTTP
      Port: 5678
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /healthz
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: 200-299

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Protocol: HTTPS
      Port: 443
      Certificates:
        - CertificateArn: !Ref SSLCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  FargateService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: n8n-service
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredTasks
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups:
            - !Ref FargateServiceSecurityGroup
      LoadBalancers:
        - TargetGroupArn: !Ref ALBTargetGroup
          ContainerName: n8n
          ContainerPort: 5678
      EnableECSManagedTags: true
      PropagateTags: SERVICE
    DependsOn: ALBListener # Ensure listener is created before service attempts to register

  ServiceAutoScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ResourceId: !Sub "service/${ECSCluster.Name}/${FargateService.Name}"
      ScalableDimension: ecs:service:DesiredCount
      MinCapacity: !Ref DesiredTasks
      MaxCapacity: !Sub "${DesiredTasks + 2}" # Example: Allow scaling up by 2 tasks

  ServiceAutoScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: n8n-cpu-scaling
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ServiceAutoScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 75.0
        ScaleInCooldown: 300
        ScaleOutCooldown: 60
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization

Outputs:
  ALBDNSName:
    Description: DNS name of the Application Load Balancer
    Value: !GetAtt ApplicationLoadBalancer.DNSName
  FargateServiceName:
    Description: Name of the Fargate Service
    Value: !GetAtt FargateService.Name
  TaskDefinitionArnOutput:
    Description: ARN of the ECS Task Definition
    Value: !Ref TaskDefinition
  ECSClusterName:
    Description: Name of the ECS Cluster
    Value: !GetAtt ECSCluster.Name
  ExecutionRoleArn:
    Description: ARN of the IAM Role for ECS Task Execution
    Value: !GetAtt ExecutionRole.Arn
  ALBArn:
    Description: ARN of the Application Load Balancer
    Value: !Ref ApplicationLoadBalancer
  ALBTargetGroupArn:
    Description: ARN of the ALB Target Group
    Value: !Ref ALBTargetGroup
  ALBListenerArn:
    Description: ARN of the ALB Listener
    Value: !Ref ALBListener
  LogGroupName:
    Description: Name of the CloudWatch Log Group
    Value: !Ref LogGroup
