# This is an example secrets file.
# ----------------------------------------------------------------
# !!! IMPORTANT !!!
# ----------------------------------------------------------------
# 1. DO NOT commit your actual secrets file (e.g., secrets.dev.yml, secrets.prod.yml) to version control.
#    Add the actual file names to your .gitignore file.
# 2. For production environments, it is STRONGLY RECOMMENDED to use
#    AWS Secrets Manager or AWS Systems Manager Parameter Store instead of YAML files for secrets.
#    Serverless Framework can reference these services directly.
#    Example for AWS Systems Manager Parameter Store:
#      mySecret: ${ssm:/my/app/mysecret~true} # ~true for SecureString decryption
#    Example for AWS Secrets Manager:
#      mySecretFromSecretsManager: ${secretsmanager:/my/secret/path}
#
# 3. To use this file structure:
#    - Copy this file to `secrets.<stage>.yml` (e.g., `secrets.dev.yml`, `secrets.prod.yml`).
#    - Populate the copied file with your actual secrets.
#    - The `serverless.yml` file is configured to load `secrets.${self:provider.stage}.yml`.
# ----------------------------------------------------------------

# Example variables (customize as needed):

# For RDS (if used, ensure these are strong and unique)
# DB_USERNAME: "your_db_username"
# DB_PASSWORD: "your_strong_db_password"
# DB_HOST: "your_rds_instance_endpoint_after_deployment" # Usually an output from RDS stack
# DB_NAME: "your_db_name"

# For other services or application-specific secrets
# API_KEY: "your_api_key"
# ANOTHER_SECRET: "another_secret_value"

# Example of how it might be referenced in serverless.yml (within provider.environment or custom section):
# provider:
#   environment:
#     DATABASE_USER: ${self:custom.secrets.DB_USERNAME}
#     DATABASE_PASSWORD: ${self:custom.secrets.DB_PASSWORD}
# custom:
#   secrets: ${file(secrets.${self:provider.stage}.yml)}

# If you have stage-specific values that are not sensitive, you can put them here too,
# or in a separate config file (e.g., config.<stage>.yml).
