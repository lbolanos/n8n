# resources/asg.yml
Parameters:
  LaunchTemplateId:
    Type: String
    Description: ID of the EC2 Launch Template to use. (e.g., !ImportValue ${self:service}-${self:provider.stage}-N8nLaunchTemplateId)
  LaunchTemplateVersion:
    Type: String
    Description: Version of the EC2 Launch Template. (e.g., !ImportValue ${self:service}-${self:provider.stage}-N8nLaunchTemplateVersion)
  N8nAppTargetGroupArn:
    Type: String
    Description: ARN of the ALB Target Group. (e.g., !ImportValue ${self:service}-${self:provider.stage}-N8nAppTargetGroupArn)
  # Using the same private subnets as defined in vpc.yml for EC2 instances, assuming ALB is in public.
  # If instances need public IPs directly (not typical when behind ALB), use public subnet IDs.
  # For this setup, instances are in private subnets, ALB is in public.
  PrivateSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: ID of the first private subnet for ASG instances. (e.g., !ImportValue ${self:service}-${self:provider.stage}-PrivateSubnet1Id)
  PrivateSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: ID of the second private subnet for ASG instances. (e.g., !ImportValue ${self:service}-${self:provider.stage}-PrivateSubnet2Id)
  DesiredCapacity:
    Type: Number
    Description: Desired number of instances in the ASG.
    Default: 1 # Start with 1, can be scaled.
  MinSize:
    Type: Number
    Description: Minimum number of instances in the ASG.
    Default: 1
  MaxSize:
    Type: Number
    Description: Maximum number of instances in the ASG.
    Default: 2 # Example, adjust as needed

Resources:
  N8nApplicationAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: ${self:service}-${self:provider.stage}-n8n-asg
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplateId
        Version: !Ref LaunchTemplateVersion
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      DesiredCapacity: !Ref DesiredCapacity
      VPCZoneIdentifier: # Subnets where instances will be launched
        - !Ref PrivateSubnet1Id
        - !Ref PrivateSubnet2Id
      TargetGroupARNs: # Attach to ALB Target Group
        - !Ref N8nAppTargetGroupArn
      HealthCheckType: ELB # Use ELB health checks for ASG
      HealthCheckGracePeriod: 300 # Seconds. Time to allow instance to start before ELB health checks start.
      Tags:
        - Key: Name
          Value: ${self:service}-${self:provider.stage}-n8n-asg-instance
          PropagateAtLaunch: true # Propagate this tag to instances launched by ASG
        - Key: Stage
          Value: ${self:provider.stage}
          PropagateAtLaunch: true
    # UpdatePolicy: # Optional: Define an update policy for rolling updates
    #   AutoScalingScheduledAction:
    #     IgnoreUnmodifiedGroupSizeProperties: true
    #   AutoScalingRollingUpdate:
    #     MinInstancesInService: !Ref MinSize # Or a specific number
    #     MaxBatchSize: '1'
    #     PauseTime: PT5M # Example: 5 minutes
    #     WaitOnResourceSignals: true # If using cfn-signal for more complex deployments

