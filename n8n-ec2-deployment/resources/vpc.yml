Conditions:
  IsProd: !Not [ !Equals ["${opt:stage, self:provider.stage}", "dev"]]


# resources/vpc.yml
Resources:
  N8NVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: N8N-VPC-${self:custom.stage}

  # Public Subnets (for ALB, and EC2 if it needs direct public IP initially, or Bastion)
  N8NPublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref N8NVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: ${aws:region}a # Choose an AZ
      MapPublicIpOnLaunch: true # For resources that need it directly
      Tags:
        - Key: Name
          Value: N8N-PublicSubnet1-${self:custom.stage}

  N8NPublicSubnet2: # For ALB high availability
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref N8NVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: ${aws:region}b # Choose a different AZ
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: N8N-PublicSubnet2-${self:custom.stage}

  # Private Subnets (for EC2 and RDS - recommended for security)
  N8NPrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref N8NVPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: ${aws:region}a
      Tags:
        - Key: Name
          Value: N8N-PrivateSubnet1-${self:custom.stage}

  N8NPrivateSubnet2: # For RDS high availability / EC2 in different AZ
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref N8NVPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: ${aws:region}b
      Tags:
        - Key: Name
          Value: N8N-PrivateSubnet2-${self:custom.stage}

  # Internet Gateway for Public Subnets
  N8NInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: N8N-IGW-${self:custom.stage}

  N8NVPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref N8NVPC
      InternetGatewayId: !Ref N8NInternetGateway

  # NAT Gateway for Private Subnets (if they need outbound internet)
  N8NEIPForNAT: # Elastic IP for NAT Gateway
    Type: AWS::EC2::EIP
    Condition: IsProd
    Properties:
      Domain: vpc

  N8NNATGateway:
    Type: AWS::EC2::NatGateway
    Condition: IsProd
    Properties:
      AllocationId: !GetAtt N8NEIPForNAT.AllocationId
      SubnetId: !Ref N8NPublicSubnet1 # NAT Gateway lives in a public subnet
      Tags:
        - Key: Name
          Value: N8N-NATGateway-${self:custom.stage}

  # Route Tables
  N8NPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref N8NVPC
      Tags:
        - Key: Name
          Value: N8N-PublicRouteTable-${self:custom.stage}

  N8NPublicRoute: # Route to Internet Gateway
    Type: AWS::EC2::Route
    DependsOn: N8NVPCGatewayAttachment
    Properties:
      RouteTableId: !Ref N8NPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref N8NInternetGateway

  N8NPublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref N8NPublicSubnet1
      RouteTableId: !Ref N8NPublicRouteTable

  N8NPublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref N8NPublicSubnet2
      RouteTableId: !Ref N8NPublicRouteTable

  N8NPrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref N8NVPC
      Tags:
        - Key: Name
          Value: N8N-PrivateRouteTable-${self:custom.stage}

  N8NPrivateRoute: # Route to NAT Gateway for outbound internet
    Type: AWS::EC2::Route
    Condition: IsProd
    Properties:
      RouteTableId: !Ref N8NPrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref N8NNATGateway

  N8NPrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref N8NPrivateSubnet1
      RouteTableId: !Ref N8NPrivateRouteTable

  N8NPrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref N8NPrivateSubnet2
      RouteTableId: !Ref N8NPrivateRouteTable

Outputs:
  VPCId:
    Description: ID of the N8N VPC
    Value: !Ref N8NVPC
    Export:
      Name: ${self:custom.stage}-VPCId
  PublicSubnet1Id:
    Description: ID of Public Subnet 1
    Value: !Ref N8NPublicSubnet1
    Export:
      Name: ${self:custom.stage}-PublicSubnet1Id
  PublicSubnet2Id:
    Description: ID of Public Subnet 2
    Value: !Ref N8NPublicSubnet2
    Export:
      Name: ${self:custom.stage}-PublicSubnet2Id
  PrivateSubnet1Id:
    Description: ID of Private Subnet 1
    Value: !Ref N8NPrivateSubnet1
    Export:
      Name: ${self:custom.stage}-PrivateSubnet1Id
  PrivateSubnet2Id:
    Description: ID of Private Subnet 2
    Value: !Ref N8NPrivateSubnet2
    Export:
      Name: ${self:custom.stage}-PrivateSubnet2Id
